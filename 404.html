<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Разлом</title>
  <script>
    // GitHub Pages Single Page App 404 redirect handler
    (function() {
      try {
        var l = window.location;
        var hostname = l.hostname || '';
        var pathname = l.pathname || '';
        var search = l.search || '';
        var hash = l.hash || '';

        // If on github.io, first path segment is repo name
        var segments = pathname.split('/').filter(Boolean);
        var repoPrefix = '';
        var routePath = '';

        if (hostname.endsWith('github.io') && segments.length > 0) {
          repoPrefix = '/' + segments[0];
          routePath = segments.slice(1).join('/');
        } else {
          routePath = segments.join('/');
        }

        var fullRoute = routePath + (search ? (routePath ? '?' : '') + search.replace(/^\?/, '') : '');
        var redirectUrl = l.protocol + '//' + l.host + repoPrefix + '/?rp_route=' + encodeURIComponent(fullRoute) + hash;
        l.replace(redirectUrl);
      } catch (e) {
        window.location.href = './';
      }
    })();
  </script>
</head>
<body style="background: #070709; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0;">
  <div style="text-align: center;">
    <h2 style="font-size: 1.5rem; color: #c084fc;">Переход в Разлом...</h2>
    <p style="color: #a1a1aa; font-size: 0.875rem;">Загрузка ролевого пространства</p>
  </div>
</body>
</html>
